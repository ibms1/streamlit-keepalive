name: Keep Streamlit Apps Awake

on:
  workflow_dispatch:

  schedule:
    - cron: "17 0,8,16 * * *"

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Open Streamlit apps
        run: node keepalive.js

      - name: Update heartbeat
        run: |
          echo "Last keepalive: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > heartbeat.txt

      - name: Commit heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add heartbeat.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update keepalive heartbeat"
            git push
          fi
